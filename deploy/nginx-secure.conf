# ==============================================
# JP&Co - Secure + Stable Nginx Configuration
# Place at: /etc/nginx/sites-available/the-system
# Reload:   sudo nginx -t && sudo systemctl reload nginx
# ==============================================

# --- Rate limiting zones ---
# IMPORTANT: zones must NOT be too strict or mobile carriers (which share IPs
# via CGNAT) get randomly 502'd while desktop/WiFi works fine. Keep these
# high enough to serve a shared 4G/5G IP comfortably.
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=connlimit:10m;

# --- Block bad bots and scanners ---
map $http_user_agent $bad_bot {
    default 0;
    ~*(?:masscan|nikto|sqlmap|nmap|dirbuster|gobuster|nuclei) 1;
    ~*(?:zgrab|censys|shodan|semrushbot|ahrefsbot|mj12bot|dotbot) 1;
    "" 1;
}

# --- Upstream with keepalive (fixes flaky 502 on mobile) ---
# nginx keeps a pool of idle TCP connections to Next.js instead of opening a
# fresh socket per request. This is the single most important fix for the
# "502 on some phones / some locations" symptom.
upstream nextjs_app {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=15s;
    keepalive 64;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

# --- HTTP -> HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name jpandco.cloud www.jpandco.cloud srv1339976.hstgr.cloud;

    if ($bad_bot) { return 444; }

    # Let's Encrypt challenges must stay on HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS server ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jpandco.cloud www.jpandco.cloud srv1339976.hstgr.cloud;

    # SSL (Certbot — make sure cert covers jpandco.cloud)
    ssl_certificate /etc/letsencrypt/live/jpandco.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jpandco.cloud/privkey.pem;

    # Fallback if cert filename is different — leave commented unless needed
    # ssl_certificate /etc/letsencrypt/live/srv1339976.hstgr.cloud/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/srv1339976.hstgr.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    if ($bad_bot) { return 444; }

    server_tokens off;

    # Connection limit — increased from 20 to 100 so mobile browsers with
    # many open tabs / shared CGNAT IPs don't get kicked out.
    limit_conn connlimit 100;

    # Body size — 25MB (covers PDF uploads, POS files, voucher images)
    client_max_body_size 25m;

    # Slowloris protection + reasonable mobile timeouts
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 75s;
    keepalive_requests 1000;

    # Gzip compression — faster mobile loads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Request-ID $request_id always;

    # --- Common proxy settings (DRY) ---
    # Applied to every location block
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_cache_bypass $http_upgrade;
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;
    proxy_busy_buffers_size 64k;

    # Timeouts — these are THE fix for 502 on slow AI/WA routes.
    # Defaults (60s) killed long-running AI calls → 502 to client.
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Retry upstream on transient errors instead of serving 502 immediately
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 30s;

    # --- Block access to hidden files (.env, .git, etc) ---
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block common WP / scanner attack paths
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc|phpmyadmin|admin\.php) {
        deny all;
        return 444;
    }

    # Block backup / temp file scans
    location ~* \.(sql|bak|backup|old|orig|save|swp|tmp|log)$ {
        deny all;
        return 444;
    }

    # --- Health check (cheap, never rate-limited) ---
    location = /api/health {
        proxy_pass http://nextjs_app;
        access_log off;
    }

    # --- Auth routes (strictest rate limit) ---
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://nextjs_app;
    }

    # --- AI routes (longer timeout — AI calls can take 30-60s) ---
    location ~ ^/api/ai/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://nextjs_app;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # --- WhatsApp send API ---
    location ~ ^/api/whatsapp/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://nextjs_app;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # --- Other API routes ---
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://nextjs_app;
    }

    # --- WhatsApp internal service (block external) ---
    location /whatsapp-internal/ {
        deny all;
        return 444;
    }

    # --- Static assets (long-term cache) ---
    location /_next/static/ {
        proxy_pass http://nextjs_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location /_next/image {
        proxy_pass http://nextjs_app;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # --- Main app ---
    location / {
        limit_req zone=general burst=100 nodelay;
        proxy_pass http://nextjs_app;
    }

    # --- Custom error pages to avoid leaking nginx version ---
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        return 503 "Service temporarily unavailable. Please try again in a moment.\n";
    }
}
