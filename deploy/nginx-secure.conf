# ==============================================
# JP&Co - Secure Nginx Configuration (HTTPS)
# Place at: /etc/nginx/sites-available/the-system
# ==============================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=connlimit:10m;

# Block bad bots and scanners
map $http_user_agent $bad_bot {
    default 0;
    ~*(?:masscan|nikto|sqlmap|nmap|dirbuster|gobuster|nuclei) 1;
    ~*(?:zgrab|censys|shodan|semrush|ahrefs|mj12bot|dotbot) 1;
    "" 1;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name srv1339976.hstgr.cloud;

    # Block bad bots even on HTTP
    if ($bad_bot) {
        return 444;
    }

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name srv1339976.hstgr.cloud;

    # SSL certificate (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/srv1339976.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1339976.hstgr.cloud/privkey.pem;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Block bad bots immediately
    if ($bad_bot) {
        return 444;
    }

    # Hide server version
    server_tokens off;

    # Connection limits
    limit_conn connlimit 20;

    # Max body size (prevents large payload attacks)
    client_max_body_size 10m;

    # Timeouts (prevents slowloris attacks)
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Block access to hidden files (.env, .git, etc)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block common attack paths
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc|phpmyadmin|admin\.php|\.env) {
        deny all;
        return 444;
    }

    # Block common vulnerability scanners
    location ~* \.(sql|bak|backup|old|orig|save|swp|tmp)$ {
        deny all;
        return 444;
    }

    # API routes with stricter rate limiting
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Don't expose internal errors
        proxy_intercept_errors on;
    }

    # Auth routes with strictest rate limiting
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WhatsApp service - internal only (block external access)
    location /whatsapp-internal/ {
        deny all;
        return 444;
    }

    # Main app
    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static files caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
